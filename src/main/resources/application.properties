# Application Configuration
spring.application.name=usuarios-api
server.port=${PORT:8080}
spring.main.banner-mode=off

# Database Configuration (Variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usuarios_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=UsuariosHikariPool

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# Logging Configuration - Limpio y minimalista
logging.level.root=WARN
logging.level.com.ejemplo.usuarios=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.apache.catalina=WARN